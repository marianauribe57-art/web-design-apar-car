name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run build

  backend:
    name: Backend (instalar y validar Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # URL falsa: solo sirve para que Prisma valide el esquema, no se conecta a nada
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - run: npm ci
    - run: npx prisma validate
